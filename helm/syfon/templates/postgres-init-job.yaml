{{- if .Values.postgres.initJob.enabled }}
{{- $tlsMode := include "syfon.postgresTLSMode" . -}}
{{- $tlsEnabled := ne $tlsMode "disabled" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-postgres-init-%d" (include "syfon.fullname" . | trunc 36 | trimSuffix "-") .Release.Revision }}
  labels:
    {{- include "syfon.labels" . | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ .Values.postgres.initJob.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.postgres.initJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.postgres.initJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "syfon.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: postgres-init
          image: {{ .Values.postgres.initJob.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export PGPASSWORD="${PG_ADMIN_PASSWORD}"

              max_wait_seconds="${PG_WAIT_TIMEOUT_SECONDS:-180}"
              waited_seconds=0
              until pg_isready -h "${PG_ADMIN_HOST}" -p "${PG_ADMIN_PORT}" -U "${PG_ADMIN_USER}"; do
                if [ "${waited_seconds}" -ge "${max_wait_seconds}" ]; then
                  echo "Timed out after ${max_wait_seconds}s waiting for PostgreSQL at ${PG_ADMIN_HOST}:${PG_ADMIN_PORT}"
                  exit 1
                fi
                echo "Waiting for PostgreSQL at ${PG_ADMIN_HOST}:${PG_ADMIN_PORT}... (${waited_seconds}s/${max_wait_seconds}s)"
                sleep 2
                waited_seconds=$((waited_seconds + 2))
              done

              psql -h "${PG_ADMIN_HOST}" -p "${PG_ADMIN_PORT}" -U "${PG_ADMIN_USER}" -d "${PG_ADMIN_DB}" -v ON_ERROR_STOP=1 \
                -v db_user="${DRS_DB_USER}" -v db_password="${DRS_DB_PASSWORD}" -v db_name="${DRS_DB_NAME}" <<'SQL'
              SELECT NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'db_user') AS create_role \gset
              \if :create_role
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'db_user', :'db_password') \gexec
              \else
              SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'db_user', :'db_password') \gexec
              \endif

              SELECT NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db_name') AS create_database \gset
              \if :create_database
              SELECT format('CREATE DATABASE %I OWNER %I', :'db_name', :'db_user') \gexec
              \endif
              SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'db_name', :'db_user') \gexec
              SQL

              export PGPASSWORD="${DRS_DB_PASSWORD}"
              psql -h "${DRS_DB_HOST}" -p "${DRS_DB_PORT}" -U "${DRS_DB_USER}" -d "${DRS_DB_NAME}" -v ON_ERROR_STOP=1 -f /sql/drs_schema.sql
          env:
            - name: PG_WAIT_TIMEOUT_SECONDS
              value: {{ .Values.postgres.initJob.waitTimeoutSeconds | quote }}
            {{- if $tlsEnabled }}
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/ssl/certs/postgres/ca.crt
            {{- end }}
            - name: DRS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "syfon.appDbSecretName" . }}
                  key: db_host
            - name: DRS_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "syfon.appDbSecretName" . }}
                  key: db_port
            - name: DRS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "syfon.appDbSecretName" . }}
                  key: db_username
            - name: DRS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syfon.appDbSecretName" . }}
                  key: db_password
            - name: DRS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "syfon.appDbSecretName" . }}
                  key: db_database
            - name: PG_ADMIN_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "syfon.adminDbSecretName" . }}
                  key: host
            - name: PG_ADMIN_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "syfon.adminDbSecretName" . }}
                  key: port
            - name: PG_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "syfon.adminDbSecretName" . }}
                  key: username
            - name: PG_ADMIN_PASSWORD
              {{- $global := (.Values.global | default dict) -}}
              {{- $pg := (get $global "postgres" | default dict) -}}
              {{- $master := (get $pg "master" | default dict) -}}
              {{- $globalMasterPass := (get $master "password" | default "") -}}
              {{- if and (not .Values.postgres.admin.existingSecret) (get $global "dev") (not .Values.postgres.admin.password) (not $globalMasterPass) }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: postgres-password
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "syfon.adminDbSecretName" . }}
                  key: password
              {{- end }}
            - name: PG_ADMIN_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "syfon.adminDbSecretName" . }}
                  key: database
          volumeMounts:
            {{- if $tlsEnabled }}
            - name: postgres-ca
              mountPath: /etc/ssl/certs/postgres
              readOnly: true
            {{- end }}
            - name: schema
              mountPath: /sql
              readOnly: true
      volumes:
        {{- if $tlsEnabled }}
        - name: postgres-ca
          secret:
            secretName: {{ include "syfon.postgresTLSSecretName" . }}
            items:
              - key: {{ include "syfon.postgresTLSCAKey" . }}
                path: ca.crt
        {{- end }}
        - name: schema
          configMap:
            name: {{ printf "%s-postgres-schema-%d" (include "syfon.fullname" . | trunc 36 | trimSuffix "-") .Release.Revision }}
{{- end }}
