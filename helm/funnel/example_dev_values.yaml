image:
  repository: quay.io/ohsu-comp-bio/funnel
  tag: v0.12.3
  pullPolicy: IfNotPresent
  initContainers:
    - name: plugins
      image: ghcr.io/calypr/funnel-gen3-auth
      tag: REPLACE_WITH_BUILT_IMAGE_TAG
      pullPolicy: IfNotPresent
      command:
        - cp
        - /funnel-gen3-auth
        - /opt/funnel/plugin-binaries/auth-plugin
      volumeMounts:
        - name: plugin-volume
          mountPath: /opt/funnel/plugin-binaries

Server:
  OidcAuth:
    ServiceConfigURL: ""
    ClientId: ""
    ClientSecret: ""
    RequireAudience: ""
    RedirectURL: ""

storage:
  workspace:
    storageClassName: ""
    size: 10Gi

Plugins:
  Params:
    ETL_IMAGE: ""
    DRS_URL: http://syfon:8080
    LOOM_URL: http://loom:8080

Kubernetes:
  JobsNamespace: ""
  ReconcileRate: 10s
