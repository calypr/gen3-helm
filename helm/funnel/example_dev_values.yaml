image:
  repository: quay.io/ohsu-comp-bio/funnel
  tag: ""
  pullPolicy: IfNotPresent
  initContainers:
    - name: plugins
      image: ghcr.io/calypr/funnel-gen3-auth
      tag: sha-fec8d7d
      pullPolicy: IfNotPresent
      command:
        - cp
        - /funnel-gen3-auth
        - /opt/funnel/plugin-binaries/auth-plugin
      volumeMounts:
        - name: plugin-volume
          mountPath: /opt/funnel/plugin-binaries

# For a private registry, uncomment and use an existing Secret in the Funnel namespace.
# imagePullSecrets:
#   - name: ghcr-pull-secret

storage:
  workspace:
    storageClassName: ""
    size: 10Gi

Plugins:
  Params:
    ETL_IMAGE: ""
    DATAFRAME_ETL_IMAGE: ""
    DRS_URL: http://syfon:8080
    LOOM_URL: http://loom:8080

Kubernetes:
  JobsNamespace: ""
  ReconcileRate: 10s
