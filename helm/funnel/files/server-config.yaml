Compute: {{ .Values.Compute }}

Kubernetes:
  DisableReconciler: {{ .Values.Kubernetes.DisableReconciler }}
  DisableJobCleanup: {{ .Values.Kubernetes.DisableJobCleanup }}
  ReconcileRate: {{ .Values.Kubernetes.ReconcileRate }}
  Namespace: {{ .Release.Namespace }}
  JobsNamespace: {{ .Values.Kubernetes.JobsNamespace | default .Release.Namespace | quote }}
  ServiceAccount: {{ .Values.Kubernetes.ServiceAccount | default (printf "funnel-sa-%s" .Release.Namespace) | quote }}
  WorkerImage: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) | quote }}
  Storage:
    WorkspaceVolume: workspace
    WorkerContainer: funnel-worker
    ExecutorContainer: funnel-executor
    volumeMounts:
      - name: workspace
        mountPath: /workspace
    volumeClaimTemplates:
      - metadata:
          name: workspace
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: {{ required "funnel.storage.workspace.storageClassName is required" .Values.storage.workspace.storageClassName | quote }}
          resources:
            requests:
              storage: {{ .Values.storage.workspace.size | quote }}
  Resources:
    Defaults:
      Cpus: {{ .Values.Kubernetes.Resources.Defaults.Cpus | quote }}
      RamGb: {{ .Values.Kubernetes.Resources.Defaults.RamGb | quote }}
      DiskGb: {{ .Values.Kubernetes.Resources.Defaults.DiskGb | quote }}
    Limits:
      Cpus: {{ .Values.Kubernetes.Resources.Limits.Cpus | quote }}
      RamGb: {{ .Values.Kubernetes.Resources.Limits.RamGb | quote }}
      DiskGb: {{ .Values.Kubernetes.Resources.Limits.DiskGb | quote }}
  Timeout:
    duration: {{ .Values.Kubernetes.Timeout.duration }}

  NodeSelector:
    {{- if .Values.Kubernetes.NodeSelector }}
    {{- range $key, $value := .Values.Kubernetes.NodeSelector }}
    {{ $key }}: {{ $value }}
    {{- end }}
    {{- end }}

  Tolerations:
    {{- if .Values.Kubernetes.Tolerations }}
    {{- range .Values.Kubernetes.Tolerations }}
    - Key: {{ .Key }}
      Operator: {{ .Operator }}
      {{- if .Value }}
      Value: {{ .Value }}
      {{- end }}
      Effect: {{ .Effect }}
      {{- if .TolerationSeconds }}
      TolerationSeconds: {{ .TolerationSeconds }}
      {{- end }}
    {{- end }}
    {{- end }}

  # Worker Job
  WorkerTemplate: |
{{ tpl ((.Values.Kubernetes.WorkerTemplate | default (.Files.Get "files/worker-job.yaml"))) . | indent 4 }}

  # Executor Job
  ExecutorTemplate: |
{{ tpl ((.Values.Kubernetes.ExecutorTemplate | default (.Files.Get "files/executor-job.yaml"))) . | indent 4 }}

  ConfigMapTemplate: |
{{ tpl (.Files.Get "files/worker-configmap-template.yaml") . | indent 4 }}

Database: {{ .Values.Database }}

EventWriters:
  {{- range .Values.EventWriters }}
  - {{ . }}
  {{- end }}

Logger:
  level: {{ .Values.Logger.level }}
  outputFile: {{ .Values.Logger.outputFile }}

Server:
  HostName: "{{ .Values.Server.HostName }}"
  HTTPPort: "{{ .Values.Server.HTTPPort }}"
  RPCPort: "{{ .Values.Server.RPCPort }}"
  DisableHTTPCache: {{ .Values.Server.DisableHTTPCache }}
  TaskAccess: Owner
  OidcAuth:
    ServiceConfigURL: {{ .Values.Server.OidcAuth.ServiceConfigURL | default (printf "https://%s/user/.well-known/openid-configuration" .Values.global.hostname) | quote }}
    ClientId: {{ .Values.Server.OidcAuth.ClientId | quote }}
    ClientSecret: {{ .Values.Server.OidcAuth.ClientSecret | quote }}
    RequireScope: {{ .Values.Server.OidcAuth.RequireScope | quote }}
    RequireAudience: {{ .Values.Server.OidcAuth.RequireAudience | quote }}
    RedirectURL: {{ .Values.Server.OidcAuth.RedirectURL | quote }}

RPCClient:
  ServerAddress: {{ .Values.RPCClient.ServerAddress }}
  Timeout:
    duration: {{ .Values.RPCClient.Timeout.duration }}
  MaxRetries: {{ .Values.RPCClient.MaxRetries }}

Scheduler:
  ScheduleRate: {{ .Values.Scheduler.ScheduleRate }}
  ScheduleChunk: {{ .Values.Scheduler.ScheduleChunk }}
  NodePingTimeout:
    duration: {{ .Values.Scheduler.NodePingTimeout.duration }}
  NodeInitTimeout:
    duration: {{ .Values.Scheduler.NodeInitTimeout.duration }}

Node:
  ID: {{ .Values.Node.ID }}
  Timeout:
    disabled: {{ .Values.Node.Timeout.disabled }}
  UpdateRate: {{ .Values.Node.UpdateRate }}
  Resources:
    Cpus: {{ .Values.Node.Resources.Cpus }}
    RamGb: {{ .Values.Node.Resources.RamGb }}
    DiskGb: {{ .Values.Node.Resources.DiskGb }}

Worker:
  WorkDir: {{ .Values.Worker.WorkDir }}
  PollingRate: {{ .Values.Worker.PollingRate }}
  LogUpdateRate: {{ .Values.Worker.LogUpdateRate }}
  LogTailSize: {{ .Values.Worker.LogTailSize }}
  LeaveWorkDir: {{ .Values.Worker.LeaveWorkDir }}
  MaxParallelTransfers: {{ .Values.Worker.MaxParallelTransfers }}

BoltDB:
  Path: {{ .Values.BoltDB.Path }}

AmazonS3:
  Disabled: true

DynamoDB:
  TableBasename: {{ .Values.DynamoDB.TableBasename }}
  AWSConfig:
    Region: {{ .Values.DynamoDB.AWSConfig.Region }}
    Key: {{ .Values.DynamoDB.AWSConfig.Key }}
    Secret: {{ .Values.DynamoDB.AWSConfig.Secret }}

Datastore:
  Project: {{ .Values.Datastore.Project }}
  CredentialsFile: {{ .Values.Datastore.CredentialsFile }}

Postgres:
  {{- if .Values.postgres.host }}
  Host: {{ .Values.postgres.host }}
  {{- else if .Values.global.dev }}
  Host: {{ .Release.Name }}-postgresql
  {{- else }}
  Host: {{ .Values.global.postgres.master.host }}
  {{- end }}
  Database: {{ include "gen3.service-postgres" (dict "key" "database" "service" .Chart.Name "context" $) | quote }}
  User: {{ include "gen3.service-postgres" (dict "key" "username" "service" .Chart.Name "context" $) | quote }}
  Password: {{ include "gen3.service-postgres" (dict "key" "password" "service" .Chart.Name "context" $) | quote }}
  AdminUser: {{ .Values.Postgres.AdminUser | quote }}
  AdminPassword: {{ .Values.Postgres.AdminPassword | quote }}
  Timeout:
    duration: {{ .Values.Postgres.Timeout.duration }}

Kafka:
  Servers:
  {{- if .Values.Kafka.Servers }}
  {{- range .Values.Kafka.Servers }}
  - {{ . }}
  {{- end }}
  {{- else }}
  - ""
  {{- end }}
  Topic: {{ .Values.Kafka.Topic }}

GenericS3: []

Plugins:
  Path: {{ .Values.Plugins.Path }}
  Params:
    FENCE_URL: {{ .Values.Plugins.Params.FENCE_URL | quote }}
    GECKO_URL: {{ .Values.Plugins.Params.GECKO_URL | quote }}
    DRS_URL: {{ required "funnel.Plugins.Params.DRS_URL is required" .Values.Plugins.Params.DRS_URL | quote }}
    ETL_IMAGE: {{ required "funnel.Plugins.Params.ETL_IMAGE is required" .Values.Plugins.Params.ETL_IMAGE | quote }}
    LOOM_URL: {{ .Values.Plugins.Params.LOOM_URL | quote }}
