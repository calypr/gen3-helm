{{- $global := .Values.global | default dict -}}
{{- $postgres := get $global "postgres" | default dict -}}
{{- $tls := get $postgres "tls" | default dict -}}
{{- $bundled := get $global "dev" | default false -}}
{{- $syfon := get .Values "syfon" | default dict -}}
{{- $syfonEnabled := get $syfon "enabled" | default false -}}
{{- if or $bundled $syfonEnabled -}}
{{- $mode := include "gen3.postgresTLSMode" . -}}
{{- $secretName := include "gen3.postgresTLSSecretName" . -}}
{{- $caKey := include "gen3.postgresTLSCAKey" . -}}
{{- $postgresql := .Values.postgresql | default dict -}}
{{- $postgresqlTLS := get $postgresql "tls" | default dict -}}
{{- $clusterDomain := get $postgresql "clusterDomain" | default "cluster.local" | toString | trim -}}
{{- $bitnamiTLSSecretName := get $postgresqlTLS "certificatesSecret" | default "" | toString | trim -}}
{{- $bitnamiTLSAutoGenerated := get $postgresqlTLS "autoGenerated" | default false -}}
{{- $bitnamiTLSCertFilename := get $postgresqlTLS "certFilename" | default "" | toString | trim -}}
{{- $bitnamiTLSKeyFilename := get $postgresqlTLS "certKeyFilename" | default "" | toString | trim -}}
{{- $bitnamiTLSCAFilename := get $postgresqlTLS "certCAFilename" | default "" | toString | trim -}}
{{- $serviceName := include "common.names.dependency.fullname" (dict "chartName" "postgresql" "chartValues" $postgresql "context" .) -}}
{{- $headlessServiceName := printf "%s-hl" $serviceName | trunc 63 | trimSuffix "-" -}}
{{- $dnsNames := list
      $serviceName
      (printf "%s.%s" $serviceName .Release.Namespace)
      (printf "%s.%s.svc" $serviceName .Release.Namespace)
      (printf "%s.%s.svc.%s" $serviceName .Release.Namespace $clusterDomain)
      $headlessServiceName
      (printf "%s.%s" $headlessServiceName .Release.Namespace)
      (printf "%s.%s.svc" $headlessServiceName .Release.Namespace)
      (printf "%s.%s.svc.%s" $headlessServiceName .Release.Namespace $clusterDomain) -}}
{{- if and $bundled (eq $mode "disabled") -}}
  {{- fail "global.postgres.tls.mode=disabled is not allowed while global.dev=true; bundled PostgreSQL requires TLS" -}}
{{- end -}}
{{- if and (not $bundled) (eq $mode "selfsigned") -}}
  {{- fail "global.postgres.tls.mode=selfSigned is only valid for bundled PostgreSQL; use certManager or existingSecret for external PostgreSQL" -}}
{{- end -}}
{{- if and (not $bundled) (eq $mode "certmanager") -}}
  {{- fail "global.postgres.tls.mode=certManager requires bundled PostgreSQL in this chart; use existingSecret for an external PostgreSQL server" -}}
{{- end -}}
{{- if and $bundled (ne $secretName $bitnamiTLSSecretName) -}}
  {{- fail (printf "global.postgres.tls.secretName=%q must match postgresql.tls.certificatesSecret=%q while bundled PostgreSQL is enabled" $secretName $bitnamiTLSSecretName) -}}
{{- end -}}
{{- if and $bundled (not .Values.postgresql.tls.enabled) -}}
  {{- fail "postgresql.tls.enabled must remain true when bundled PostgreSQL TLS is configured" -}}
{{- end -}}
{{- if and $bundled $bitnamiTLSAutoGenerated -}}
  {{- fail "postgresql.tls.autoGenerated must be false; global.postgres.tls is the only PostgreSQL certificate source" -}}
{{- end -}}
{{- if and $bundled (ne $bitnamiTLSCertFilename "tls.crt") -}}
  {{- fail "postgresql.tls.certFilename must be tls.crt so it matches global.postgres.tls" -}}
{{- end -}}
{{- if and $bundled (ne $bitnamiTLSKeyFilename "tls.key") -}}
  {{- fail "postgresql.tls.certKeyFilename must be tls.key so it matches global.postgres.tls" -}}
{{- end -}}
{{- if and $bundled $bitnamiTLSCAFilename -}}
  {{- fail "postgresql.tls.certCAFilename must be empty; Syfon does not configure PostgreSQL client certificates" -}}
{{- end -}}
{{- if eq $mode "selfsigned" -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
  {{- $existingData := get $existing "data" | default dict -}}
  {{- $existingCA := get $existingData $caKey | default "" -}}
  {{- $existingCert := get $existingData "tls.crt" | default "" -}}
  {{- $existingKey := get $existingData "tls.key" | default "" -}}
  {{- if $existing -}}
    {{- if or (not $existingCA) (not $existingCert) (not $existingKey) -}}
      {{- fail (printf "existing Secret %q is missing %s, tls.crt, or tls.key; refusing to rotate PostgreSQL CA" $secretName $caKey) -}}
    {{- end -}}
  {{- else -}}
    {{- $ca := genCA (printf "%s-postgres-ca" $serviceName) 3650 -}}
    {{- $server := genSignedCert $serviceName nil $dnsNames 3650 $ca -}}
    {{- $existingCA = $ca.Cert | b64enc -}}
    {{- $existingCert = $server.Cert | b64enc -}}
    {{- $existingKey = $server.Key | b64enc -}}
  {{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
type: kubernetes.io/tls
data:
  {{ $caKey }}: {{ $existingCA | quote }}
  tls.crt: {{ $existingCert | quote }}
  tls.key: {{ $existingKey | quote }}
{{- end -}}
{{- if eq $mode "certmanager" -}}
  {{- if not (.Capabilities.APIVersions.Has "cert-manager.io/v1") -}}
    {{- fail "global.postgres.tls.mode=certManager requires the cert-manager.io/v1 API; install cert-manager separately before rendering this chart" -}}
  {{- end -}}
  {{- $certManager := get $tls "certManager" | default dict -}}
  {{- $issuerRef := get $certManager "issuerRef" | default dict -}}
  {{- $issuerName := get $issuerRef "name" | default "" | toString | trim -}}
  {{- $issuerKind := get $issuerRef "kind" | default "ClusterIssuer" | toString | trim -}}
  {{- $issuerGroup := get $issuerRef "group" | default "cert-manager.io" | toString | trim -}}
  {{- if not $issuerName -}}
    {{- fail "global.postgres.tls.certManager.issuerRef.name is required" -}}
  {{- end -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-certificate" $secretName | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  secretName: {{ $secretName }}
  dnsNames:
{{ toYaml $dnsNames | nindent 4 }}
  issuerRef:
    name: {{ $issuerName | quote }}
    kind: {{ $issuerKind | quote }}
    group: {{ $issuerGroup | quote }}
{{- end -}}
{{- end -}}
