{{- $cfg := deepCopy (.Values.config | default dict) -}}
{{- $server := deepCopy (get $cfg "server" | default dict) -}}
{{- if not (hasKey $server "listen") }}{{- $_ := set $server "listen" (printf ":%v" .Values.service.port) -}}{{- end }}
{{- if not (hasKey $server "schema") }}{{- $_ := set $server "schema" "/app/schemas/graph-fhir.json" -}}{{- end }}
{{- if not (hasKey $server "url") }}{{- $_ := set $server "url" (include "loom.arangoURL" .) -}}{{- end }}
{{- if not (hasKey $server "database") }}{{- $_ := set $server "database" .Values.server.arango.database -}}{{- end }}
{{- $clickhouse := deepCopy (get $server "clickhouse" | default dict) -}}
{{- $clickhouseEnabled := and .Values.server.clickhouse.enabled (or .Values.clickstack.enabled (ne .Values.server.clickhouse.url "clickhouse://clickhouse:9000")) -}}
{{- $projectConfigsEnabled := and $clickhouseEnabled .Values.projectConfigs.enabled -}}
{{- $_ := set $clickhouse "enabled" $clickhouseEnabled -}}
{{- if $clickhouseEnabled }}
{{- $_ := set $clickhouse "username" .Values.clickstack.auth.username -}}
{{- $_ := set $clickhouse "password" .Values.clickstack.auth.password -}}
{{- end }}
{{- if $clickhouseEnabled }}
{{- if not (get $clickhouse "url" | default "") }}{{- $_ := set $clickhouse "url" (include "loom.clickhouseURL" .) -}}{{- end }}
{{- else }}
{{- $_ := set $clickhouse "url" "" -}}
{{- end }}
{{- if not (get $clickhouse "database" | default "") }}{{- $_ := set $clickhouse "database" .Values.server.clickhouse.database -}}{{- end }}
{{- $_ := set $server "clickhouse" $clickhouse -}}
{{- if $clickhouseEnabled }}
{{- $_ := set $server "dataframer" (dict "recipe" "/etc/loom/dataframer.json") -}}
{{- else }}
{{- $_ := unset $server "dataframer" -}}
{{- end }}
{{- if $projectConfigsEnabled }}
{{- $_ := set $server "project_configs" "/etc/loom/project-configs.json" -}}
{{- else }}
{{- $_ := unset $server "project_configs" -}}
{{- end }}
{{- $_ := set $cfg "server" $server -}}
{{- $auth := deepCopy (get $cfg "auth" | default dict) -}}
{{- if and (eq (get $auth "mode" | default "calypr") "calypr") (not .Values.server.noAuth) -}}
{{- $calypr := deepCopy (get $auth "calypr" | default dict) -}}
{{- if not (get $calypr "trusted_issuer" | default "") -}}
{{- $hostname := get (.Values.global | default dict) "hostname" | default "" -}}
{{- $_ := set $calypr "trusted_issuer" (printf "https://%s/user" (required "loom.config.auth.calypr.trusted_issuer or global.hostname is required" $hostname)) -}}
{{- end -}}
{{- $_ := set $auth "calypr" $calypr -}}
{{- $_ := set $cfg "auth" $auth -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loom.fullname" . }}-config
  labels:
    {{- include "loom.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
{{ toYaml $cfg | nindent 4 }}
{{- if $clickhouseEnabled }}
  dataframer.json: |
{{ (.Values.dataframer.recipe | default (.Files.Get "files/default-dataframer.json")) | nindent 4 }}
{{- end }}
{{- if $projectConfigsEnabled }}
  project-configs.json: |
{{ (.Values.projectConfigs.definitions | default (.Files.Get "files/default-project-configs.json")) | nindent 4 }}
{{- end }}
