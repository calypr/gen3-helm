{{- $persistence := .Values.arango.persistence -}}
{{- $claimName := $persistence.existingClaim | default (printf "%s-arango-data" (include "loom.fullname" .)) -}}
{{- $vm := .Values.vmStorage.enabled -}}
{{- if $vm }}{{- $claimName = "arangodb-data" -}}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arangodb
  labels:
    app.kubernetes.io/name: arangodb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  {{- if or $vm $persistence.enabled }}
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: arangodb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arangodb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if $vm }}
      initContainers:
        {{- include "loom.vmStoragePermissions" (dict "image" (include "loom.arangoImage" .) "owner" "0:0" "volume" "data") | nindent 8 }}
      {{- end }}
      containers:
        - name: arangodb
          image: {{ include "loom.arangoImage" . | quote }}
          imagePullPolicy: {{ .Values.arango.image.pullPolicy }}
          env:
            - name: ARANGO_NO_AUTH
              value: {{ ternary "1" "0" .Values.arango.noAuth | quote }}
          ports:
            - name: http
              containerPort: 8529
          volumeMounts:
            - name: data
              mountPath: /var/lib/arangodb3
      volumes:
        - name: data
          {{- if or $vm $persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $claimName | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if and (not $vm) $persistence.enabled (not $persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claimName | quote }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if ne $persistence.storageClass nil }}
  storageClassName: {{ $persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persistence.size | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: arangodb
  labels:
    app.kubernetes.io/name: arangodb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: arangodb
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8529
      targetPort: http
